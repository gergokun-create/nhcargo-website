# Render Blueprint – NH Cargo website. Everything here runs on free plans.
# Docs: https://render.com/docs/blueprint-spec
#
#  nhcargo-website   static site (www.nhcargo.hu) incl. the Decap CMS admin at /admin/
#  nhcargo-cms-auth  small backend: admin GitHub login + quote request form → info@nhcargo.hu
#                    via Microsoft 365 (Free web service, sleeps when idle; see M365_BEALLITAS.md)
services:
  - type: web
    name: nhcargo-website
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Admin drafts are pull requests: each gets its own preview URL (free for a free static
    # site). Preview builds are noindex (IS_PULL_REQUEST, see astro.config.mjs).
    previews:
      generation: automatic
    buildFilter:
      ignoredPaths:
        - cms-auth/**
    envVars:
      - key: NODE_VERSION
        value: "24"
    headers:
      # HTTPS only (Render redirects HTTP → HTTPS automatically). Add "; preload"
      # only after the domain has run on HTTPS without problems for a while.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # Clickjacking protection (the page-level CSP is in a <meta> tag; frame-ancestors only works as a header)
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'none'; base-uri 'self'; object-src 'none'
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()
      # allow-popups: the admin's GitHub login popup (nhcargo-cms-auth) must be able to
      # message back to the window that opened it; plain same-origin would cut that link
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      # Hashed build assets never change → cache for a year
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  - type: web
    name: nhcargo-cms-auth
    runtime: node
    plan: free
    region: frankfurt
    rootDir: cms-auth
    # No dependencies – nothing to install
    buildCommand: node --version
    startCommand: node server.mjs
    healthCheckPath: /health
    buildFilter:
      paths:
        - cms-auth/**
    envVars:
      - key: NODE_VERSION
        value: "24"
      # GitHub OAuth App (GitHub → Settings → Developer settings → OAuth Apps), see DEPLOY.md
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Site origins: the admin login token is only handed to these, and the quote form
      # is only accepted from these
      - key: ALLOWED_ORIGINS
        value: https://www.nhcargo.hu,https://nhcargo-website.onrender.com
      # Quote request form → email through Microsoft 365 (see M365_BEALLITAS.md). On/off,
      # recipients, sender and the tenant / client IDs are set in the admin (form.json);
      # only the secret lives here. MAIL_* are fallbacks for empty admin fields.
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MAIL_SENDER
        value: info@nhcargo.hu
      - key: MAIL_TO
        value: info@nhcargo.hu
